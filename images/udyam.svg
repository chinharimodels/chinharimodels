<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017" />
      <stop offset="50%" stop-color="#f5cf53" />
      <stop offset="100%" stop-color="#966f0e" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf7f2" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="5" y="5" width="490" height="150" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Emblem / Shield Icon -->
  <g transform="translate(30, 25)">
    <circle cx="55" cy="55" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="55" cy="55" r="44" fill="#faf7f2" stroke="rgba(212,160,23,0.3)" stroke-width="1" />
    <!-- Chakra / Sun rays symbol -->
    <path d="M55,20 L55,90 M20,55 L90,55 M30,30 L80,80 M30,80 L80,30" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <!-- Ashoka / Star Symbol -->
    <polygon points="55,32 61,46 76,46 64,55 68,69 55,60 42,69 46,55 34,46 49,46" fill="url(#goldGrad)" />
    <!-- Text arc or label -->
    <text x="55" y="86" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="#966f0e" text-anchor="middle" letter-spacing="1">MSME</text>
  </g>

  <!-- Text Details -->
  <text x="165" y="48" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#615c54" letter-spacing="2">GOVT. OF INDIA • MINISTRY OF MSME</text>
  <text x="165" y="82" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="700" fill="#1b1916" letter-spacing="1.5">UDYAM <tspan fill="#d4a017">CERTIFIED</tspan></text>
  <rect x="165" y="96" width="300" height="34" rx="6" fill="#1b1916" />
  <text x="175" y="118" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#f5cf53" letter-spacing="1">REG. NO:</text>
  <text x="245" y="119" font-family="'Montserrat', monospace" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1.5">UDYAM-CG-02-0073446</text>
